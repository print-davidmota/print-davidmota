name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    name: Generate Snake Animation
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Generate contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: print-davidmota
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00D9FF&color_dots=#0B1F33,#123A52,#007C91,#00AFC4,#00D9FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=00D9FF&color_dots=#050B14,#0B1F33,#123A52,#007C91,#00D9FF

      - name: 🚀 Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
